{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mi Sitio{% endblock %} | Parra Flores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inicio:lista_temas' %}">Parra &amp; Flores</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'lista_temas' %}active{% endif %}"
                       href="{% url 'inicio:lista_temas' %}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.kwargs.slug == 'paisajes-de-chile' %}active{% endif %}"
                       href="{% url 'inicio:detalle_tema' 'paisajes-de-chile' %}">Paisajes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.kwargs.slug == 'cocina-chilena' %}active{% endif %}"
                       href="{% url 'inicio:detalle_tema' 'cocina-chilena' %}">Cocina</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'acerca' %}active{% endif %}"
                       href="{% url 'inicio:acerca' %}">Acerca de</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-light text-center py-3 mt-auto">
    <small>&copy; 2026 Parra &amp; Flores &middot; Proyecto Django</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
